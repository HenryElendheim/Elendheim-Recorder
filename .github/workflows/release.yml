name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0"
        required: true
        default: "v1.0"
      notes:
        description: "Release notes"
        required: false
        default: "Records audio from your phone mic, keeps a library you can play, rename and delete, and exports your takes to WAV or M4A. Dark mode, no cloud, no accounts."

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Elendheim-Recorder-${{ github.event.inputs.version }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.inputs.version }}" \
            "Elendheim-Recorder-${{ github.event.inputs.version }}.apk" \
            --title "Elendheim Recorder ${{ github.event.inputs.version }}" \
            --notes "${{ github.event.inputs.notes }}" \
            --target main
