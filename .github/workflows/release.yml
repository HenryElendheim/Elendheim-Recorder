name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0"
        required: true
        default: "v1.0"
      notes:
        description: "Release notes"
        required: false
        default: "Records from your phone mic, keeps a searchable library with folders, and exports your takes to WAV or MP3. Dark mode, no cloud, no accounts."

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Elendheim-Recorder-${{ github.event.inputs.version }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ github.event.inputs.version }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          APK="Elendheim-Recorder-${V}.apk"
          if gh release view "$V" >/dev/null 2>&1; then
            # Release already exists: attach the APK and set the notes.
            gh release upload "$V" "$APK" --clobber
            gh release edit "$V" --title "Elendheim Recorder ${V}" --notes "$NOTES"
          else
            gh release create "$V" "$APK" \
              --title "Elendheim Recorder ${V}" \
              --notes "$NOTES" \
              --target main
          fi
